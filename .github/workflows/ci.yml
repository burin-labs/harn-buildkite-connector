name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@2ef969f35ae0384e786be20d9eb2467edc88e8bd

  ci-status:
    name: CI status
    if: ${{ always() }}
    needs: [harn]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@2ef969f35ae0384e786be20d9eb2467edc88e8bd
        with:
          results-json: ${{ toJSON(needs.*.result) }}
