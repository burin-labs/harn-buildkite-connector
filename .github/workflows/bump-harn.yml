name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns this generated dispatch adapter.
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/bump-harn.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@9b3260a7cf459bf4bcc072ae66ad35c4dc317c31
    with:
      orchestration-sha: 9b3260a7cf459bf4bcc072ae66ad35c4dc317c31
      version: ${{ inputs.version }}
      validate-command: harn package verify .
      publish-failure-for-repair: true
      apply-behavior-preserving-fixes: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
