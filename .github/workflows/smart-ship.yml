name: Smart Ship

# fleet.toml in harn-bump-fleet owns this generated Smart Ship caller.
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows:
      - "CI"
    types: [completed]
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  approve:
    # Approves only the release bot's runtime bumps and projection restores that
    # the pinned path policy allows; see approve-fleet-pr.yml in harn-bump-fleet.
    # Another author's pull request event has nothing for it to approve.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event.pull_request.user.login == 'harn-release-bot[bot]'
      || startsWith(github.event.workflow_run.head_branch, 'automation/')
    permissions:
      contents: read
      pull-requests: write
      checks: read
    uses: burin-labs/harn-bump-fleet/.github/workflows/approve-fleet-pr.yml@4a064ec3d0a1cb77438c7dfaf921153d19655933
    with:
      source_ref: 4a064ec3d0a1cb77438c7dfaf921153d19655933
      pull_request: ${{ github.event.pull_request.number || '' }}
  ship:
    needs: [approve]
    if: ${{ !cancelled() }}
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@7e287a6cfa82db8fd7c253120b2f13dcce34b2b9
    with:
      repair: false
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
