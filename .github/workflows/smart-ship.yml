name: Smart Ship

# fleet.toml in harn-bump-fleet owns this generated Smart Ship caller.
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows:
      - "CI"
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@7e287a6cfa82db8fd7c253120b2f13dcce34b2b9
    with:
      repair: false
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  approve:
    # Approves only the release bot's runtime bumps and projection restores that
    # the pinned path policy allows; see approve-fleet-pr.yml in harn-bump-fleet.
    permissions:
      contents: read
      pull-requests: write
      checks: read
    uses: burin-labs/harn-bump-fleet/.github/workflows/approve-fleet-pr.yml@db843be9b5e0c3b89f00270cce12f92dc938405b
    with:
      source_ref: db843be9b5e0c3b89f00270cce12f92dc938405b
      pull_request: ${{ github.event.pull_request.number || '' }}
